<svg xmlns="http://www.w3.org/2000/svg" width="760" height="456" viewBox="0 0 760 456" role="img" aria-label="Terminal session: opsh --version, --help and the test suite">
<rect width="760" height="456" rx="12" fill="#0d0d12" stroke="#2a2a33" stroke-width="2"/>
<path d="M0 12 A12 12 0 0 1 12 0 H748 A12 12 0 0 1 760 12 V34 H0 Z" fill="#17171f"/>
<circle cx="22" cy="17" r="6" fill="#ef4444"/><circle cx="42" cy="17" r="6" fill="#eab308"/><circle cx="62" cy="17" r="6" fill="#22c55e"/>
<text x="380" y="22" font-family="Consolas, Menlo, monospace" font-size="13" fill="#64748b" text-anchor="middle">real terminal output</text>
<g font-family="Consolas, Menlo, monospace" font-size="14" xml:space="preserve">
<text x="24" y="56"><tspan fill="#22c55e">$ </tspan><tspan fill="#f8fafc">python opsh.py --version</tspan></text>
<text x="24" y="76" fill="#fde047">OpenSH v0.3.0</text>
<text x="24" y="96"><tspan fill="#22c55e">$ </tspan><tspan fill="#f8fafc">python opsh.py --help</tspan></text>
<text x="24" y="116" fill="#cbd5e1">usage: opsh.py [-h] [-c [COMMAND ...]] [-y] [-v]</text>
<text x="24" y="136" fill="#cbd5e1"></text>
<text x="24" y="156" fill="#cbd5e1">OpenSH - Talk to your terminal in plain English</text>
<text x="24" y="176" fill="#cbd5e1"></text>
<text x="24" y="196" fill="#cbd5e1">options:</text>
<text x="24" y="216" fill="#cbd5e1">  -h, --help            show this help message and exit</text>
<text x="24" y="236" fill="#cbd5e1">  -c [COMMAND ...], --command [COMMAND ...]</text>
<text x="24" y="256" fill="#cbd5e1">                        Run a single natural language query and exit</text>
<text x="24" y="276" fill="#cbd5e1">  -y, --yes             Run destructive AI-generated commands without asking</text>
<text x="24" y="296" fill="#cbd5e1">                        (use with care)</text>
<text x="24" y="316" fill="#cbd5e1">  -v, --version         show program's version number and exit</text>
<text x="24" y="336" fill="#cbd5e1"></text>
<text x="24" y="356" fill="#cbd5e1">Example: opsh -c 'show me large files'</text>
<text x="24" y="376"><tspan fill="#22c55e">$ </tspan><tspan fill="#f8fafc">python -m pytest -q tests</tspan></text>
<text x="24" y="396" fill="#4ade80">......................................................................   [100%]</text>
<text x="24" y="416" fill="#4ade80">70 passed</text>
</g>
</svg>
